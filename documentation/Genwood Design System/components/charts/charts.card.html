<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script></head><body style="padding:20px;background:#fff"><div id="root"></div>
<script type="text/babel">
const { YieldCurveChart } = window.GenwoodDesignSystem_cb120d;
const m = [0.5,1,1.5,2,3,4,5,7,10,12,15,20,25,30,35,40];
const nom = m.map(t => [t, +(3.85 + 0.9 * (1 - Math.exp(-t / 9)) - 0.25 * Math.exp(-t / 1.5) + (t > 20 ? -0.004 * (t - 20) : 0)).toFixed(4)]);
const prev = nom.map(([t, y]) => [t, +(y - 0.03 + 0.001 * t).toFixed(4)]);
const real = m.map(t => [t, +(0.4 + 1.1 * (1 - Math.exp(-t / 10)) + (t < 3 ? 0.3 : 0) * (3 - t) / 3).toFixed(4)]);
function App() { return <YieldCurveChart height={280} series={[{ name: 'Nominal 1 Oct', points: nom }, { name: 'Nominal 30 Sep', points: prev, dashed: true, color: 'var(--gw-forest-300)' }, { name: 'Real 1 Oct', points: real, color: 'var(--chart-2)' }]} />; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
