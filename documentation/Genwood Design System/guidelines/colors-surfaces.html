<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-label);margin-top:6px}.v{font:var(--type-data);color:var(--fg-3);font-size:11px}</style></head><body><div class="row"><div class="sw" style="background:var(--surface-page);color:var(--fg-1);border:1px solid var(--border-default);border-radius:6px;padding:12px;height:110px;display:flex;flex-direction:column;justify-content:space-between"><div style="font:var(--type-h3)">Page</div><div class="v" style="color:inherit;opacity:.8">--surface-page</div></div><div class="sw" style="background:var(--surface-card);color:var(--fg-1);border:1px solid var(--border-default);border-radius:6px;padding:12px;height:110px;display:flex;flex-direction:column;justify-content:space-between"><div style="font:var(--type-h3)">Card</div><div class="v" style="color:inherit;opacity:.8">--surface-card</div></div><div class="sw" style="background:var(--surface-sunken);color:var(--fg-2);border:1px solid var(--border-default);border-radius:6px;padding:12px;height:110px;display:flex;flex-direction:column;justify-content:space-between"><div style="font:var(--type-h3)">Sunken</div><div class="v" style="color:inherit;opacity:.8">--surface-sunken</div></div><div class="sw" style="background:var(--surface-selected);color:var(--fg-brand);border:1px solid var(--border-default);border-radius:6px;padding:12px;height:110px;display:flex;flex-direction:column;justify-content:space-between"><div style="font:var(--type-h3)">Selected</div><div class="v" style="color:inherit;opacity:.8">--surface-selected</div></div><div class="sw" style="background:var(--surface-brand);color:var(--fg-on-brand);border:1px solid var(--border-default);border-radius:6px;padding:12px;height:110px;display:flex;flex-direction:column;justify-con
