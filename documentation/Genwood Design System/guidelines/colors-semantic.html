<!-- @dsCard group="Colors" viewport="700x120" name="Status" subtitle="Success · warning · danger · info · neutral" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:var(--type-label);margin-top:6px}.v{font:var(--type-data);color:var(--fg-3);font-size:11px}</style></head><body><div class="row"><div class="sw" style="background:var(--status-success-bg);border:1px solid var(--status-success-border);color:var(--status-success-fg);border-radius:6px;padding:12px"><div style="font:var(--type-label);text-transform:capitalize">success</div><div class="v" style="color:inherit">--status-success-*</div></div><div class="sw" style="background:var(--status-warning-bg);border:1px solid var(--status-warning-border);color:var(--status-warning-fg);border-radius:6px;padding:12px"><div style="font:var(--type-label);text-transform:capitalize">warning</div><div class="v" style="color:inherit">--status-warning-*</div></div><div class="sw" style="background:var(--status-danger-bg);border:1px solid var(--status-danger-border);color:var(--status-danger-fg);border-radius:6px;padding:12px"><div style="font:var(--type-label);text-transform:capitalize">danger</div><div class="v" style="color:inherit">--status-danger-*</div></div><div class="sw" style="background:var(--status-info-bg);border:1px solid var(--status-info-border);color:var(--status-info-fg);border-radius:6px;padding:12px"><div style="font:var(--type-label);text-transform:capitalize">info</div><div class="v" style="color:inherit">--status-info-*</div></div><div class="sw" style="background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border);color:var(--status-neutral-fg);border-radius:6px;padding:12px"><div style="font:var(--type-label);text-transform:capitalize">neutral</div><div class="v" style="color:inherit">--status-neutral-*</div></div></div></body></html>
