<!-- @dsCard group="Genwood App" viewport="1440x900" name="Genwood Yield app" subtitle="File log, file detail, curve data and yield curves" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Genwood — Yield curves</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="FileLogScreen.jsx"></script>
<script type="text/babel" src="FileDetailScreen.jsx"></script>
<script type="text/babel" src="DataScreen.jsx"></script>
<script type="text/babel" src="CurvesScreen.jsx"></script>
<script type="text/babel" src="ImportDialog.jsx"></script>
<script type="text/babel">
const { Toast } = window.GenwoodDesignSystem_cb120d;
function App() {
  const [screen, setScreen] = React.useState(localStorage.getItem('gw-screen') || 'log');
  const [files, setFiles] = React.useState(window.GW_DATA.files);
  const [fileId, setFileId] = React.useState(null);
  const [dlg, setDlg] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const nav = s => { setScreen(s); localStorage.setItem('gw-screen', s === 'file' ? 'log' : s); };
  const file = files.find(f => f.id === fileId);
  const notify = t => { setToast(t); clearTimeout(window.__gwT); window.__gwT = setTimeout(() => setToast(null), 4500); };
  const runImport = kinds => {
    setDlg(false);
    const names = { nominal: 'GLC Nominal daily data', real: 'GLC Real daily data', inflation: 'GLC Inflation daily data' };
    const now = Date.now();
    const fresh = kinds.map((k, i) => ({ id: now + i, kind: k, curve: window.GW_DATA.KINDS[k], file: names[k] + '_2026-10-01.xlsx', date: '2026-10-01', received: '02 Oct ' + new Date().toTimeString().slice(0, 5), rows: null, size: '—', status: 'info', label: 'Processing', warnings: 0, error: null, user: 'A. Mokoena', duration: '—' }));
    setFiles(fs => fresh.concat(fs));
    notify({ tone: 'info', title: 'Import started', message: kinds.length + ' file' + (kinds.length > 1 ? 's' : '') + ' requested from the Bank of England.' });
    setTimeout(() => { setFiles(fs => fs.map(f => fresh.find(x => x.id === f.id) ? { ...f, status: 'success', label: 'Imported', rows: f.kind === 'nominal' ? 1180 : 1062, size: '284 KB', duration: '2.4s' } : f));
      notify({ tone: 'success', title: 'Import complete', message: kinds.length + ' file' + (kinds.length > 1 ? 's' : '') + ' loaded without errors.' }); }, 2200);
  };
  const failed = files.filter(f => f.status === 'danger').length;
  return <>
    <AppShell screen={screen} onNav={nav} failed={failed || undefined}>
      {screen === 'log' && <FileLogScreen files={files} onImport={() => setDlg(true)} onOpen={f => { setFileId(f.id); setScreen('file'); }} />}
      {screen === 'file' && file && <FileDetailScreen file={file} onBack={() => setScreen('log')} onReimport={() => runImport([file.kind])} onViewCurve={() => nav('curves')} />}
      {screen === 'data' && <DataScreen />}
      {screen === 'curves' && <CurvesScreen />}
    </AppShell>
    <ImportDialog open={dlg} onClose={() => setDlg(false)} onImport={runImport} />
    {toast && <div style={{ position: 'fixed', right: 24, bottom: 24, zIndex: 200 }}><Toast {...toast} onClose={() => setToast(null)} /></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
